name: Daily Jobs Sync
# No `schedule:` — GitHub's cron ran hours late. Supabase pg_cron job
# `gh-daily-jobs-sync` (18:00 UTC == 23:30 IST, 30 min after daily-sync so
# the two don't hit Supabase at the same minute) dispatches this instead.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r sync/requirements.txt
      - run: python sync/sync_jobs.py
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
