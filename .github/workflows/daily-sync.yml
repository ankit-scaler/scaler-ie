name: Daily Sheet Sync
on:
  schedule:
    - cron: '30 17 * * *'   # 17:30 UTC == 23:00 IST
  workflow_dispatch:
    inputs:
      full_resync:
        description: "Hard refresh: also delete questions/assignments no longer in the sheet"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r sync/requirements.txt
      - run: python sync/sync_sheet.py
        env:
          SHEET_ID:             ${{ secrets.SHEET_ID }}
          LEARNERS_SHEET_ID:    ${{ secrets.LEARNERS_SHEET_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_CREDS_JSON:    ${{ secrets.GOOGLE_CREDS_JSON }}
          FULL_RESYNC:          ${{ github.event.inputs.full_resync }}
