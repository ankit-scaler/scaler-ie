name: Daily Slack Digest
# No `schedule:` — GitHub's cron ran hours late. Supabase pg_cron job
# `gh-daily-digest` (12:30 UTC == 18:00 IST) dispatches this workflow instead.
on:
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r sync/requirements.txt
      - run: python sync/daily_digest.py
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLACK_DAILY_DIGEST_WEBHOOK_URL: ${{ secrets.SLACK_DAILY_DIGEST_WEBHOOK_URL }}
