name: Backfill AI Topics
on:
  workflow_dispatch: {}
  # No schedule — this is the large one-off pass that reclassifies every
  # question's AI topic from scratch (fixes bad classifications, not just
  # unclassified rows). The nightly Daily Sheet Sync handles new rows
  # incrementally on its own; no need to run this after every sync.

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r sync/requirements.txt
      - run: python sync/backfill_topics.py
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
