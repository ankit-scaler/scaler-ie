name: Backfill AI Topics
on:
  workflow_dispatch: {}
  # No schedule — this is the large one-off (or "catch up on anything the
  # nightly cap skipped") classification pass. The nightly Daily Sheet Sync
  # already handles new rows incrementally on its own.

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r sync/requirements.txt
      - run: python sync/backfill_topics.py
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
